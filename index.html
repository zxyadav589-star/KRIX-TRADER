<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIX BHAI - Official Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #0d0606;
            border: 1.5px solid #ff3b00;
            border-radius: 28px;
            padding: 30px 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 59, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .badge {
            border: 1px solid #ff3b00;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #ff3b00;
            text-transform: uppercase;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #ff3b00;
            border-radius: 50%;
        }

        .title {
            color: #ff3b00;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 59, 0, 0.4);
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .stat-box {
            flex: 1;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #ff3b00;
        }

        .stat-label {
            font-size: 9px;
            color: #a0a0a0;
            letter-spacing: 1px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .btn-telegram {
            background: linear-gradient(90deg, #ff3b00, #ff5500);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            padding: 16px 20px;
            border-radius: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(255, 59, 0, 0.5);
            margin-bottom: 25px;
        }

        .members-count {
            font-size: 26px;
            font-weight: 800;
            color: #ff3b00;
            margin-top: 5px;
        }

        .sub-features {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            font-size: 10px;
            color: #808080;
        }

        .disclaimer {
            font-size: 9px;
            color: #505050;
            margin-top: 25px;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="card">

        <h1 class="title">KRIX BHAI</h1>

                <div class="stat-label">SUPPORT</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">100%</div>
                <div class="stat-label">FREE</div>
            </div>
        </div>

        <!-- Aapka Telegram Link Updated -->
        <a href="https://t.me/+7LjmGQRUdig2MWY1" class="btn-telegram">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.128.832.941z"/>
            </svg>
            JOIN ON TELEGRAM
        </a>

        <div class="stat-label">ACTIVE MEMBERS</div>
        <div class="members-count">1.1K+</div>

        <div class="sub-features">
            <span>◆ 100% Free</span>
            <span>◆ New Content Daily</span>
        </div>

        <p class="disclaimer">
            This channel provides educational content and market analysis for informational purposes only.
        </p>
    </div>

</body>
</html>
